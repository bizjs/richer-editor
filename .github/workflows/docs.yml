name: Deploy docs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            docs/vitepress-plugin-react-demo/pnpm-lock.yaml

      - name: Set up GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install React demo plugin dependencies
        working-directory: docs/vitepress-plugin-react-demo
        run: pnpm install --ignore-workspace --frozen-lockfile

      - name: Build React demo plugin
        working-directory: docs/vitepress-plugin-react-demo
        run: pnpm build

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build editor package
        run: pnpm --filter @bizjs/richer-editor build

      - name: Build documentation
        run: pnpm docs:build
        env:
          DOCS_BASE: ${{ steps.pages.outputs.base_path }}/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy docs
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
